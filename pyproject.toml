[project]
name = "robotwin-annotation-v2"
version = "0.2.0"
description = "Three-stage target/receiver visible-mask pipeline for RoboTwin"
requires-python = ">=3.13"
dependencies = [
  "av>=18.0",
  "numpy<2",
  "pandas>=2.0",
  "pyarrow>=25.0",
  "pillow>=10.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
sam3 = [
  "torch==2.7.1+cu128",
  "torchvision==0.22.1+cu128",
  "opencv-python-headless>=5.0",
  "sam3 @ git+https://github.com/facebookresearch/sam3.git@8e451d5eb43c817b64ae7577fb7b9ae223db88a9",
]
dev = [
  "pytest>=9.0",
  "pytest-cov>=4.1",
  "mypy>=1.5",
  "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["robotwin_annotation_v2*"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"
