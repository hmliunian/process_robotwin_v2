annotation:
  mode: target_only

dataset:
  root: /DATA/disk8/xuran/add_mask_robotwin/dataset/target_only_20/adjust_bottle
  manifest: datasets/adjust_bottle_target_only20.json
  task: adjust_bottle
  camera: cam_high
  smoke_episode_ids: [0]
  regression_episode_ids: [0, 6, 10, 18, 21, 30, 34, 42, 48, 49,
                           50, 51, 171, 176, 287, 313, 415, 431, 547, 549]

# This is also the implicit target-only profile for ``just process --data-path``.
# Its mode-specific prompts use the close-and-hold timeline while enabling the
# same S1-S3 open-set ladder as pick-place.
qwen:
  endpoint: http://127.0.0.1:18086/v1/chat/completions
  model: qwen3.5-27b
  prompt_template: prompts/target_only_semantic_open_set.txt
  # Six image frames can be slow when the shared Qwen GPU is busy.  The
  # target-only JSON has one role, so 400 output tokens are ample while the
  # longer HTTP timeout avoids abandoning an in-flight generation.
  timeout_seconds: 600
  max_tokens: 400
  query_selection: first_recommended
  allow_query_fallback: false

sam3:
  checkpoint: ../checkpoints/sam3/sam3.pt
  gpus: [2]

mask:
  target_envelope_padding_px: 4
  receiver_envelope_padding_px: 4
  temporal_qc_min_adjacent_iou_p05: 0.5
  temporal_qc_max_centroid_jump_p95_px: 5.0
  temporal_qc_max_area_ratio_jump_p95: 0.4
  temporal_qc_quarantine_signal_count: 2
  qc_enabled: true
  qc_prompt_template: prompts/target_only_mask_candidate_qc_open_set.txt
  qc_max_candidates: 8
  qc_query_fallback_enabled: true
  qc_seed_fallback_enabled: true
  qc_bbox_fallback_enabled: true
  qc_bbox_prompt_template: prompts/open_set_bbox_localization.txt
  qc_bbox_max_tokens: 180
  qc_max_tokens: 160
  qc_max_attempts: 2
  qc_min_confidence: 0.70
  qc_min_area_fraction: 0.0001
  qc_max_area_fraction: 0.85
  qc_duplicate_iou_threshold: 0.98

# The target-only mode uses the default URDF gripper backend. These values are
# retained because the shared config schema also supports the legacy SAM backend.
gripper_roi:
  prompt:
    axial_back_m: 0.120
    axial_front_m: 0.060
  hard:
    axial_back_m: 0.120
    axial_front_m: 0.045
  fixed_half_width_m: 0.085

output:
  root: ../artifacts/runs
