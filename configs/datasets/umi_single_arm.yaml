    annotation_mode: tool_use
    task_text: >-
      Perform a scooping action with a tool already held by one gripper. Target: the complete held spoon, scoop or ladle, including its visible handle and working head. Receiver: the independent vessel that the working tool enters during scooping, not the furniture supporting the vessel. No grasp or release event is required. Ignore any object held by the idle hand.
