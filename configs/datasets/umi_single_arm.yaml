  push_real:
    annotation_mode: target_only
    task_text: >-
      Use one gripper to open or close a drawer. Target: the complete independent handle or knob directly driven by the active gripper. Only if no separable handle exists, use the moving drawer front panel. Follow the actual video direction, not the directory verb. Do not select the drawer interior, whole cabinet, or neighboring handles.
    task_text_zh: 单手操作抽屉，标注实际被驱动的完整把手；无独立把手时标移动前面板。
