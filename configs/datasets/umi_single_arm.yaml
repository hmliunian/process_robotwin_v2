    annotation_mode: target_only
    task_text: >-
      Use one gripper to open or close a cabinet or appliance door. Target: the complete separable handle directly driven by the active gripper, including its attached mounting parts. Only if no separable handle exists, use the moving door panel. Follow the actual action, not the directory verb. Do not select the cabinet body or an adjacent door.
    task_text_zh: 单手操作柜门或家电门，标注被驱动的完整把手；无独立把手时标移动门板。
