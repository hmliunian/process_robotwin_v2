    annotation_mode: target_only
    task_text: >-
      Turn over an object with one gripper. Target: the entire object actually picked up and flipped, including all visible connected parts. Use before, during and after flipping evidence to distinguish it from supporting furniture, containers and nearby objects. Only the manipulated object is required.
    task_text_zh: 单手翻转物体，标注被翻转的完整物体，不标支撑家具或周围容器。
