# Data One Task 配置
# 用于测试 Process Data V2 的 mask 生成

# 数据集路径
data_root: ../process_data/data_one_task

# 测试 episodes（前 3 个）
episodes:
  - "000000"  # 142 帧
  - "000001"
  - "000002"

# 任务类型（从 episodes.jsonl 推断）
coarse_task: move_bottle_to_pad  # 推断的任务类型

# 相机
camera: cam_high

# Phase 1: target 和 receiver（如果有）
roles:
  - target_0

# Qwen grounding service（复用 process_data 的服务）
qwen_service:
  url: "http://localhost:18086"

# SAM3 checkpoint（复用 process_data 的 checkpoint）
sam3_checkpoint: "../process_data/checkpoints/sam3/sam3.pt"

# 输出目录
output_dir: "artifacts/data_one_task"

# QC thresholds
qc:
  min_area_fraction: 0.001
  max_area_fraction: 0.5
  min_bbox_overlap: 0.3
