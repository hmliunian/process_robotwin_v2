      Wipe a surface with a cleaning tool already held by one gripper. Target: the complete held cleaning cloth or sponge, excluding the gripper. Receiver: the complete independent physical object being wiped, such as a chair, sofa, rack or table; an independently bounded removable surface is also eligible. Do not label an arbitrary contact patch, wiping trajectory, nearby cloth, or surrounding room. No grasp or release event is required.
